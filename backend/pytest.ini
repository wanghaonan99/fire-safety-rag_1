[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
# 不扫描数据目录、虚拟环境与临时目录，避免误收集与权限报错
norecursedirs = .venv venv data .pytest_cache pytest-cache-files-* node_modules .git
# 关掉缓存写入：部分受限运行环境不允许写 .pytest_cache
addopts = -q -p no:cacheprovider
filterwarnings =
    ignore::DeprecationWarning
