# Alembic 配置：脚本目录放在 app/db/migrations 下（与用户给定的目录树一致）
#
# 常用命令（在 backend/ 目录执行）：
#   alembic revision --autogenerate -m "init schema"
#   alembic upgrade head
#   alembic downgrade -1
#
# 注意：连接串不写在这里，由 env.py 从 .env 的 DATABASE_URL 读取，
#       避免把 Neon 密码提交到仓库。

[alembic]
script_location = app/db/migrations
prepend_sys_path = .
version_path_separator = os
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
