# ============================================================================
# Nginx 反代：对外 80/443 → api:8000
#
# 关键点（每一条都是踩过的坑）：
#   · client_max_body_size 50m   → 否则上传大 PDF 直接 413
#   · proxy_read_timeout 600s    → 首次提问/首次导入要等模型加载 60~90 秒
#   · proxy_buffering off        → 以后接 SSE 流式输出时不会被 nginx 攒着
#   · X-Forwarded-*              → 后端拿得到真实 IP / 协议
# ============================================================================

upstream fsrag_api {
    server api:8000;
    keepalive 32;
}

server {
    listen 80;
    server_name _;          # ← 有域名后改成你的域名

    # Let's Encrypt 校验用（certbot --webroot -w /var/www/certbot）
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    client_max_body_size 50m;
    client_body_timeout 300s;

    # 健康检查直出，不打日志
    location = /health {
        proxy_pass http://fsrag_api;
        access_log off;
    }

    location / {
        proxy_pass http://fsrag_api;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 长请求：首次加载模型、大批量导入都可能超过 60 秒
        proxy_connect_timeout 30s;
        proxy_send_timeout    600s;
        proxy_read_timeout    600s;

        # 为将来的 SSE / 流式输出准备
        proxy_buffering off;
        proxy_cache off;
    }

    gzip on;
    gzip_types application/json text/plain text/css application/javascript;
    gzip_min_length 1024;
}

